<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2e2e2e;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 800px;
        }
        .left-panel {
            flex: 1;
            padding: 40px;
            text-align: center;
            background-color: #1a3c34;
            color: #fff;
            border-radius: 15px 0 0 15px;
        }
        .right-panel {
            flex: 1;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2e2e2e;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #444;
        }
        a {
            display: block;
            margin-top: 20px;
            color: #2e2e2e;
            text-decoration: none;
        }
        .left-panel h2 {
            color: #ffd700;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .left-panel p {
            font-size: 0.8em;
        }
        .left-panel img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <img src="2.jpg" alt="Grading Process">
            <h2>Simplify your grading process</h2>
            <p>EduSpark revolutionizes the way you grade your students' papers. Save time and ensure fair evaluation.</p>
        </div>
        <div class="right-panel">
            <h1>Forgot your password?</h1>
            <p>Enter your account email address to receive a password reset link by email.</p>
            <input type="email" placeholder="Email address">
            <button>Reset my password</button>
            <a href="login1.html">Login</a>
        </div>
    </div>
</body>
</html>
